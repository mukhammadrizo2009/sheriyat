databases:
  - name: sheriyat-db
    databaseName: sheriyat_db
    user: sheriyat_user
    plan: free

services:
  # 1. Django REST Backend Web Service
  - type: web
    name: sheriyat-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sheriyat-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: TELEGRAM_BOT_TOKEN
        value: "8366867582:AAFqSv0QJuP87xdb17vHZNDxwi0WXwd67PQ"
      - key: TELEGRAM_ADMIN_CHAT_ID
        value: "6293681152"

  # 2. React Frontend Static Site
  - type: web
    name: sheriyat-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: sheriyat-backend
          property: host
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
